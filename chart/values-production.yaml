trino:
  server:
    workers: 3
    config:
      query:
        maxMemory: 25.9GB
  coordinator:
    jvm:
      maxRAMPercentage: 60
    resources:
      requests:
        memory: 12Gi
      limits:
        memory: 12Gi
  worker:
    jvm:
      maxRAMPercentage: 80
    resources:
      requests:
        memory: 36Gi
      limits:
        memory: 36Gi
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution: null
        requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              component: worker
