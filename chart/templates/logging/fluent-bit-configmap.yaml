{{- if .Values.logging.fluentBit.enabled -}}
{{- $outputs := .Values.logging.fluentBit.outputs -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "peaka.fluentBit.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "peaka.fluentBit.fullname" . }}
    {{- include "peaka.labels" . | nindent 4 }}
data:
  # Parsers, filters and record fields mirror the cloud pipeline (be-iac
  # tools/*-tools-values.yaml, stream fluent_bit_kube) so searches carry over.
  custom_parsers.conf: |
    [PARSER]
        Name   nginx_error_logs
        Format regex
        Regex  ^(?<timestamp>\d{4}\/\d{2}\/\d{2} \d{2}:\d{2}:\d{2}) \[(?<log_level>[a-z]*)\] (?<pid>[0-9]+)#(?<tid>[0-9]+): (?<message>[a-zA-Z0-9 "\/.()_:-]*)$

  fluent-bit.conf: |
    [SERVICE]
        Daemon        Off
        Flush         1
        Log_Level     info
        Parsers_File  /fluent-bit/etc/parsers.conf
        Parsers_File  /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        Health_Check  On

    # Only this release's namespace. Fluent Bit's and OpenObserve's own logs are
    # skipped: each ingest call makes them log a line, which would be shipped too.
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*_{{ .Release.Namespace }}_*.log
        Exclude_Path      /var/log/containers/{{ include "peaka.fluentBit.fullname" . }}-*, /var/log/containers/{{ include "peaka.openobserve.fullname" . }}-*
        # docker = Docker JSON log files (e.g. RKE1), cri = containerd/CRI-O (e.g. RKE2)
        multiline.parser  docker, cri
        DB                /var/lib/fluent-bit/state/tail.db
        Read_from_head    true
        Mem_Buf_Limit     32MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [FILTER]
        Name      parser
        Match     kube.var.log.containers.*studio-web*
        Key_Name  log
        Parser    nginx_error_logs

    # Peaka Java services log JSON (log4j2 JsonTemplateLayout)
    [FILTER]
        Name      parser
        Match     kube.*
        Key_Name  log
        Parser    json

    # unparsed lines keep the whole line in `log`; rename for the cloud schema
    [FILTER]
        Name      modify
        Match     kube.*
        Rename    log message

    [FILTER]
        Name             kubernetes
        Match            kube.*
        Kube_Tag_Prefix  kube.var.log.containers.
        Buffer_Size      0
        Labels           Off
        Annotations      Off

    [FILTER]
        Name          nest
        Match         kube.*
        Operation     lift
        Nested_under  kubernetes
        Add_prefix    kubernetes_

    [FILTER]
        Name        record_modifier
        Match       kube.*
        Remove_key  kubernetes_namespace_name
        Remove_key  kubernetes_docker_id
        Remove_key  kubernetes_container_hash

    # a dot in the key breaks OpenObserve field names
    [FILTER]
        Name      modify
        Match     kube.*
        Rename    log.level log_level

    # dispatcher-assigner logs every assignment at INFO
    [FILTER]
        Name        grep
        Match       kube.*
        Logical_Op  AND
        Exclude     kubernetes_container_name /.*dispatcher-assigner.*/
        Exclude     log_level /.*INFO.*/
    {{- if $outputs.openobserve.enabled }}

    # Retry until OpenObserve is back: tail has already moved its offsets past a
    # chunk's lines, so a dropped chunk is lost. Mem_Buf_Limit bounds memory
    # (tail pauses; unread lines wait in the node's log files).
    [OUTPUT]
        Name              http
        Match             kube.*
        Host              {{ include "peaka.openobserve.fullname" . }}.{{ .Release.Namespace }}.svc
        Port              5080
        URI               /api/default/fluent_bit_kube/_json
        Format            json
        json_date_format  iso8601
        json_date_key     @timestamp
        HTTP_User         ${OPENOBSERVE_USER}
        HTTP_Passwd       ${OPENOBSERVE_TOKEN}
        tls               Off
        Retry_Limit       no_limits
        compress          gzip
    {{- end }}
{{- end }}
