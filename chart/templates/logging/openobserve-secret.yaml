{{- if and .Values.logging.openobserve.enabled (not .Values.logging.openobserve.existingSecret) -}}
{{- $name := include "peaka.openobserve.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := dict "ZO_ROOT_USER_EMAIL" (.Values.logging.openobserve.rootUserEmail | b64enc) -}}
{{- range $key := list "ZO_ROOT_USER_EMAIL" "ZO_ROOT_USER_PASSWORD" "ZO_ROOT_USER_TOKEN" -}}
{{- if and $existing $existing.data (hasKey $existing.data $key) -}}
{{- $_ := set $data $key (index $existing.data $key) -}}
{{- else if not (hasKey $data $key) -}}
{{- $_ := set $data $key (randAlphaNum 32 | b64enc) -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "peaka.labels" . | nindent 4 }}
  annotations:
    # OpenObserve stores the root user (email, password and token) on its PVC at
    # first start; new values after an uninstall/reinstall would not match it.
    helm.sh/resource-policy: keep
type: Opaque
data:
  ZO_ROOT_USER_EMAIL: {{ $data.ZO_ROOT_USER_EMAIL | quote }}
  ZO_ROOT_USER_PASSWORD: {{ $data.ZO_ROOT_USER_PASSWORD | quote }}
  # Root's ingestion token: accepted only on ingestion endpoints, so Fluent Bit
  # never needs the root password.
  ZO_ROOT_USER_TOKEN: {{ $data.ZO_ROOT_USER_TOKEN | quote }}
{{- end }}
