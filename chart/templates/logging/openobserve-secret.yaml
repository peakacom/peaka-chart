{{- if and .Values.logging.openobserve.enabled (not .Values.logging.openobserve.existingSecret) -}}
{{- $name := include "peaka.openobserve.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "ZO_ROOT_USER_PASSWORD") -}}
{{- $password = index $existing.data "ZO_ROOT_USER_PASSWORD" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 24 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "peaka.labels" . | nindent 4 }}
  annotations:
    # OpenObserve stores the root user on its PVC at first start; a new random
    # password after an uninstall/reinstall would no longer match it.
    helm.sh/resource-policy: keep
type: Opaque
data:
  ZO_ROOT_USER_EMAIL: {{ .Values.logging.openobserve.rootUserEmail | b64enc | quote }}
  ZO_ROOT_USER_PASSWORD: {{ $password | b64enc | quote }}
{{- end }}
