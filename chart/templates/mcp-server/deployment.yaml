apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "peaka.fullname" . }}-peaka-mcp-server
  labels:
    app.kubernetes.io/name: {{ include "peaka.fullname" . }}-peaka-mcp-server
    {{- include "peaka.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.mcpServer.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "peaka.fullname" . }}-peaka-mcp-server
      {{- include "peaka.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "peaka.fullname" . }}-peaka-mcp-server
        {{- include "peaka.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/env-configmap.yaml") . | sha256sum }}
    spec:
      imagePullSecrets:
        {{- if .Values.peakaContainerRegistryAccessSecret }}
        - name: {{ .Values.peakaContainerRegistryAccessSecret.name }}
        {{- end }}
        {{- range $_, $secret := .Values.imagePullSecrets }}
        - name: {{ $secret }}
        {{- end }}
      {{- if eq (include "peaka.customCA.enabled" .) "true" }}
      initContainers:
        {{- include "peaka.customCA.initContainer.node" (dict "image" (printf "%s/%s:%s" (default (include "peaka.image.registry" .) .Values.mcpServer.image.registry) .Values.mcpServer.image.name .Values.mcpServer.image.tag)) | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp-server
          image: {{ default (include "peaka.image.registry" .) .Values.mcpServer.image.registry }}/{{ .Values.mcpServer.image.name }}:{{ .Values.mcpServer.image.tag }}
          imagePullPolicy: {{ default "IfNotPresent" .Values.mcpServer.image.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: PORT
              value: "80"
            - name: TRANSPORT
              value: "httpStream"
          envFrom:
            - configMapRef:
                name: {{ include "peaka.fullname" . }}-env-config
          {{- with .Values.mcpServer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.mcpServer.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.mcpServer.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.mcpServer.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
          {{- if eq (include "peaka.customCA.enabled" .) "true" }}
            - name: custom-ca-bundle
              mountPath: /custom-ca-bundle
              readOnly: true
          {{- end }}
      volumes:
      {{- if eq (include "peaka.customCA.enabled" .) "true" }}
        - name: custom-ca-certs
          configMap:
            name: {{ include "peaka.fullname" . }}-custom-ca-certs
        - name: custom-ca-bundle
          emptyDir: {}
      {{- end }}
      {{- if .Values.mcpServer.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.mcpServer.terminationGracePeriodSeconds }}
      {{- end }}
      {{- include "peaka.common.nodeSelector" ( dict "nodeSelector" .Values.mcpServer.nodeSelector "global" $.Values.global) | nindent 6 }}
      {{- with .Values.mcpServer.affinity }}
      affinity:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "peaka.common.tolerations" ( dict "tolerations" .Values.mcpServer.tolerations "global" $.Values.global) | nindent 6 }}
