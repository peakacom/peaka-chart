{{- /*
The Deployment/Service/Secret keep the "pgcat" names so an existing install upgrades in place
and Permify's URI does not change; the pooler behind them is PgBouncer. Timeouts in
pgcat.configuration.general stay in milliseconds (pgcat units) and are converted here.
*/ -}}
{{- $g := .Values.pgcat.configuration.general }}
{{- $db := .Values.permify.app.database.name }}
{{- $pool := first .Values.pgcat.configuration.pools | default dict }}
{{- $user := include "peaka.postgresql.user" . }}
{{- $password := include "peaka.postgresql.password" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "peaka.pgcat.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "peaka.pgcat.fullname" . }}
type: Opaque
stringData:
  pgbouncer.ini: |
    [databases]
    {{ $db }} = host={{ include "peaka.postgresql.host" . }} port={{ include "peaka.postgresql.port" . }} dbname={{ $db }} pool_size={{ $g.pool_size }} min_pool_size={{ $g.min_pool_size }}

    [pgbouncer]
    listen_addr = {{ $g.host }}
    listen_port = {{ $g.port }}
    unix_socket_dir =
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt
    admin_users = {{ $g.admin_username }}
    pool_mode = {{ default "session" $pool.pool_mode }}
    max_client_conn = {{ $g.max_client_conn }}
    default_pool_size = {{ $g.pool_size }}
    ignore_startup_parameters = plan_cache_mode,extra_float_digits
    server_connect_timeout = {{ div $g.connect_timeout 1000 }}
    server_idle_timeout = {{ div $g.idle_timeout 1000 }}
    server_lifetime = {{ div $g.server_lifetime 1000 }}
    server_check_delay = {{ div $g.healthcheck_delay 1000 }}
    idle_transaction_timeout = {{ div $g.idle_client_in_transaction_timeout 1000 }}
    tcp_keepidle = {{ $g.tcp_keepalives_idle }}
    tcp_keepcnt = {{ $g.tcp_keepalives_count }}
    tcp_keepintvl = {{ $g.tcp_keepalives_interval }}
    log_connections = {{ ternary 1 0 $g.log_client_connections }}
    log_disconnections = {{ ternary 1 0 $g.log_client_disconnections }}
    {{- if $g.server_tls }}
    server_tls_sslmode = verify-full
    server_tls_ca_file = {{ ternary "/custom-ca-bundle/ca-certificates.crt" "/etc/ssl/certs/ca-certificates.crt" (eq (include "peaka.customCA.enabled" .) "true") }}
    {{- else }}
    server_tls_sslmode = disable
    {{- end }}
    {{- if and (ne $g.tls_certificate "-") (ne $g.tls_private_key "-") }}
    client_tls_sslmode = allow
    client_tls_cert_file = {{ $g.tls_certificate }}
    client_tls_key_file = {{ $g.tls_private_key }}
    {{- else }}
    client_tls_sslmode = disable
    {{- end }}
  userlist.txt: |
    "{{ $user | replace "\"" "\"\"" }}" "{{ $password | replace "\"" "\"\"" }}"
    {{- if ne $g.admin_username $user }}
    "{{ $g.admin_username | replace "\"" "\"\"" }}" "{{ $g.admin_password | replace "\"" "\"\"" }}"
    {{- end }}
