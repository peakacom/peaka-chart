{{- if .Values.global.openshiftRestricted }}
{{- /* Restricted clusters block emptyDir/ephemeral; the coordinator's trino-var
       (/data/trino) becomes a PVC (single replica, RWO + Recreate suffices).
       The worker gets per-replica claims via volumeClaimTemplates instead
       (statefulset-_worker.yaml) — a shared RWO PVC multi-attach-fails at
       replicas > 1. */}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ template "peaka.trino.coordinator" . }}-var
  labels:
    app: {{ template "peaka.trino.fullname" . }}
    component: coordinator
    {{- include "peaka.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  {{- include "peaka.common.storage.class" (dict "persistence" .Values.trino.coordinator.persistence "global" .Values.global) | nindent 2 }}
{{- end }}
