{{- if .Values.global.openshiftRestricted }}
{{- /* Restricted clusters block emptyDir/ephemeral; trino-var (/data/trino) becomes a PVC.
       Worker autoscaling is off and replicas=1, so RWO PVC + Recreate suffices. */}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ template "peaka.trino.coordinator" . }}-var
  labels:
    app: {{ template "peaka.trino.fullname" . }}
    component: coordinator
    {{- include "peaka.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  {{- include "peaka.common.storage.class" (dict "persistence" .Values.trino.coordinator.persistence "global" .Values.global) | nindent 2 }}
{{- if gt (int .Values.trino.server.workers) 0 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ template "peaka.trino.worker" . }}-var
  labels:
    app: {{ template "peaka.trino.fullname" . }}
    component: worker
    {{- include "peaka.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  {{- include "peaka.common.storage.class" (dict "persistence" .Values.trino.coordinator.persistence "global" .Values.global) | nindent 2 }}
{{- end }}
{{- end }}
