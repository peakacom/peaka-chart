apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "peaka.trino.coordinator" . }}
  labels:
    app: {{ template "peaka.trino.fullname" . }}
    chart: {{ template "peaka.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    component: coordinator
data:
  node.properties: |
    node.environment={{ .Values.trino.server.node.environment }}
    node.data-dir={{ .Values.trino.server.node.dataDir }}
    plugin.dir={{ .Values.trino.server.node.pluginDir }}
  {{- range $configValue := .Values.trino.additionalNodeProperties }}
    {{ $configValue }}
  {{- end }}

  jvm.config: |
    -server
  {{- if .Values.trino.coordinator.jvm.maxHeapSize }}
    -Xmx{{ .Values.trino.coordinator.jvm.maxHeapSize }}
  {{- else }}
    -XX:MaxRAMPercentage={{ .Values.trino.coordinator.jvm.maxRAMPercentage }}
  {{- end }}
  {{- with .Values.trino.coordinator.jvm.maxDirectMemorySize }}
    -XX:MaxDirectMemorySize={{ . }}
  {{- end }}
    -XX:+{{ .Values.trino.coordinator.jvm.gcMethod.type }}
    -XX:G1HeapRegionSize={{ .Values.trino.coordinator.jvm.gcMethod.g1.heapRegionSize }}
    -XX:+UseGCOverheadLimit
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+ExitOnOutOfMemoryError
    -Djdk.attach.allowAttachSelf=true
    -XX:ReservedCodeCacheSize=512M
    -XX:PerMethodRecompilationCutoff=10000
    -XX:PerBytecodeRecompilationCutoff=10000
    -Djdk.nio.maxCachedBufferSize=2000000
    -Dfile.encoding=UTF-8
    -XX:+UnlockDiagnosticVMOptions
  {{- if .Values.trino.server.kerberosConfig }}
    -Djava.security.krb5.conf={{ .Values.trino.server.kerberosConfigPath }}/krb5.conf
  {{- end }}
  {{- if eq (include "peaka.customCA.enabled" .) "true" }}
    -Djavax.net.ssl.trustStore=/truststore/cacerts
    -Djavax.net.ssl.trustStorePassword=changeit
  {{- end }}
  {{- range $configValue := .Values.trino.coordinator.additionalJVMConfig }}
    {{ $configValue }}
  {{- end }}

  config.properties: |
    coordinator=true
{{- if gt (int .Values.trino.server.workers) 0 }}
    node-scheduler.include-coordinator=false
{{- else }}
    node-scheduler.include-coordinator=true
{{- end }}
    http-server.http.port={{ .Values.trino.service.port }}
    http-server.process-forwarded=true
    query.max-memory={{ .Values.trino.server.config.query.maxMemory }}
{{- with .Values.trino.coordinator.config.query.maxMemoryPerNode }}
    query.max-memory-per-node={{ . }}
{{- end }}
    query.max-length={{ .Values.trino.coordinator.config.query.maxLength }}
    catalog.management=DYNAMIC
{{- if .Values.trino.coordinator.config.memory.heapHeadroomPerNode }}
    memory.heap-headroom-per-node={{ .Values.trino.coordinator.config.memory.heapHeadroomPerNode }}
{{- end }}
    discovery.uri=http://localhost:{{ .Values.trino.service.port }}
{{- if .Values.trino.server.config.authenticationType }}
    http-server.authentication.type={{ .Values.trino.server.config.authenticationType }}
{{- end }}
  {{- range $configValue := .Values.trino.additionalConfigProperties }}
    {{ $configValue }}
  {{- end }}
  {{- if .Values.trino.server.config.https.enabled }}
    http-server.https.enabled=true
    http-server.https.port={{ .Values.trino.server.config.https.port }}
    http-server.https.keystore.path={{ .Values.trino.server.config.https.keystore.path }}
  {{- end }}
  {{ .Values.trino.server.coordinatorExtraConfig | indent 4 }}

{{- if .Values.trino.accessControl }}
  {{- if eq .Values.trino.accessControl.type "configmap" }}
  access-control.properties: |
    access-control.name=file
    {{- if .Values.trino.accessControl.refreshPeriod }}
    security.refresh-period={{ .Values.trino.accessControl.refreshPeriod }}
    {{- end }}
    security.config-file={{ .Values.trino.server.config.path }}/access-control/{{ .Values.trino.accessControl.configFile | default "rules.json" }}
  {{- else if eq .Values.trino.accessControl.type "properties" }}
  access-control.properties: |
    {{- if .Values.trino.accessControl.properties }}
    {{- .Values.trino.accessControl.properties | nindent 4 }}
    {{- else}}
    {{- fail "accessControl.properties is required when accessControl.type is 'properties'." }}
    {{- end }}
  {{- else}}
  {{- fail "Invalid accessControl.type value. It must be either 'configmap' or 'properties'." }}
  {{- end }}
{{- end }}

  exchange-manager.properties: |
    exchange-manager.name={{ .Values.trino.server.exchangeManager.name }}
  {{ if eq .Values.trino.server.exchangeManager.name "filesystem" }}
    exchange.base-directory={{ .Values.trino.server.exchangeManager.baseDir }}
  {{- end }}  
  {{- range $configValue := .Values.trino.additionalExchangeManagerProperties }}
    {{ $configValue }}
  {{- end }}

  log.properties: |
    io.trino={{ .Values.trino.server.log.trino.level }}
  {{- range $configValue := .Values.trino.additionalLogProperties }}
    {{ $configValue }}
  {{- end }}

{{- range $fileName, $fileContent := .Values.trino.server.kerberosConfig }}
  {{ $fileName | nindent 2 }}: |
    {{- $fileContent | nindent 4 }}
{{- end }}

{{- range $fileName, $fileContent := .Values.trino.server.hiveConfig }}
  {{ $fileName | nindent 2 }}: |
    {{- $fileContent | nindent 4 }}
{{- end }}

{{- if .Values.trino.resourceGroups.enabled }}
{{- $extra := .Values.trino.coordinator.additionalConfigFiles | default dict }}
{{- if or (hasKey $extra "resource-groups.properties") (hasKey $extra "resource-groups.json") }}
{{- fail "trino.resourceGroups.enabled writes resource-groups.properties and resource-groups.json: remove them from trino.coordinator.additionalConfigFiles." }}
{{- end }}
{{- $l := .Values.trino.resourceGroups.limits }}
  resource-groups.properties: |
    resource-groups.configuration-manager=file
    resource-groups.config-file={{ .Values.trino.server.config.path }}/resource-groups.json
  {{- /* The LAST selector must stay a bare catch-all: a query that matches no selector fails.
         Selectors match the WHOLE user string, hence (,.*)? after the project id. */}}
  resource-groups.json: |
    {
      "rootGroups": [
        {
          "name": "global",
          "softMemoryLimit": "100%",
          "hardConcurrencyLimit": {{ int $l.global.running }},
          "maxQueued": {{ int $l.global.queued }},
          "schedulingPolicy": "weighted_fair",
          "jmxExport": true,
          "subGroups": [
            { "name": "health", "softMemoryLimit": "5%", "hardConcurrencyLimit": {{ int $l.health.running }}, "maxQueued": {{ int $l.health.queued }}, "schedulingWeight": 10 },
            { "name": "system", "softMemoryLimit": "100%", "hardConcurrencyLimit": {{ int $l.system.running }}, "maxQueued": {{ int $l.system.queued }}, "schedulingWeight": 3 },
            {
              "name": "tenants",
              "softMemoryLimit": "100%",
              "hardConcurrencyLimit": {{ int $l.tenants.running }},
              "maxQueued": {{ int $l.tenants.queued }},
              "schedulingWeight": 5,
              "schedulingPolicy": "fair",
              "subGroups": [
                { "name": "${project}", "softMemoryLimit": "100%", "hardConcurrencyLimit": {{ int $l.project.running }}, "maxQueued": {{ int $l.project.queued }} }
              ]
            },
            { "name": "other", "softMemoryLimit": "20%", "hardConcurrencyLimit": {{ int $l.other.running }}, "maxQueued": {{ int $l.other.queued }}, "schedulingWeight": 1 }
          ]
        }
      ],
      "selectors": [
        { "user": "trino", "source": "^$", "group": "global.health" },
        { "user": "trino|code2db", "group": "global.system" },
        { "user": "project:(?<project>[A-Za-z0-9_-]+)(,.*)?", "group": "global.tenants.${project}" },
        { "group": "global.other" }
      ]
    }
{{- end }}

{{- range $fileName, $fileContent := .Values.trino.coordinator.additionalConfigFiles }}
  {{ $fileName }}: |
    {{- tpl $fileContent $ | nindent 4 }}
{{- end }}
