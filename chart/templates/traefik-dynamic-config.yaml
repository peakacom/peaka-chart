{{- /*
CRD-free Traefik routing.

This dynamic configuration replaces the former IngressRoute/Middleware custom
resources one-to-one, so the chart no longer needs the Traefik CRDs (and the
install stays fully namespace-scoped). Traefik loads it through its file
provider: the ConfigMap is mounted into the Traefik pod via
traefik.deployment.additionalVolumes and read with
--providers.file.filename=/config/dynamic.yaml (see the traefik block in
values.yaml).

The ConfigMap name is intentionally a fixed literal (not release-scoped):
subchart values cannot be templated, so the volume in values.yaml has to
reference a constant name. Same applies to the TLS secret (peaka-traefik-tls).
*/}}
{{- if .Values.traefik.enabled }}
{{- $fullname := include "peaka.fullname" . }}
{{- $ep := include "peaka.ingress.entryPoint" . }}
{{- $ns := .Release.Namespace }}
{{- $svcPath := include "peaka.routes.servicePath" . }}
{{- $mode := dig "provider" "file" (.Values.routing | default dict) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: peaka-traefik-dynamic-config
  labels:
    app.kubernetes.io/name: {{ $fullname }}-traefik-dynamic-config
    {{- include "peaka.labels" . | nindent 4 }}
data:
{{- if ne $mode "file" }}
  # routing.provider is "{{ $mode }}": routing is served by the kubernetesCRD
  # provider (IngressRoute/Middleware objects), this file stays empty on purpose.
  dynamic.yaml: |
    http: {}
{{- else }}
  dynamic.yaml: |
    http:
      routers:
        api:
          entryPoints: ["{{ $ep }}"]
          rule: "PathPrefix(`/{{ include "peaka.routes.apiPath" . }}`)"
          priority: 10
          service: be-dispatcher
        # Refuses /custom from outside. It is not an API but the gateway's own second hop: a published call arrives as
        # /api/v1/**, ApiKeyFilter authenticates it and the gateway rewrites it to /custom/api/v1/** and sends it to
        # itself. ApiKeyFilter runs only for exchanges the gateway routes, so a request sent straight to /custom/** is
        # answered by the local controllers with no check at all. Mirrors ingresses/cloud-gateway-ingress-route.yaml.
        cloud-gateway-deny-internal-path:
          entryPoints: ["{{ $ep }}"]
          rule: "PathPrefix(`/{{ include "peaka.routes.partnerPath" . }}/custom`)"
          priority: 200
          middlewares: ["deny-internal-path"]
          service: be-cloud-gateway
        cloud-gateway:
          entryPoints: ["{{ $ep }}"]
          rule: "PathPrefix(`/{{ include "peaka.routes.partnerPath" . }}`)"
          priority: 10
          middlewares: ["strip-partner"]
          service: be-cloud-gateway
        collab-sharedb:
          entryPoints: ["{{ $ep }}"]
          rule: "PathPrefix(`/{{ $svcPath }}/sharedb`)"
          priority: 10
          middlewares: ["forwarded-proto", "strip-sharedb"]
          service: be-collab-sharedb-websocket
        # On the forwardAuth routes below the prefix is stripped first, so permission-service sees the path the
        # service serves (/data-cache/..., /search/...), as on SaaS. Its handlers read the path from the first
        # segment (DEV-4136) and refuse a prefixed one. Mirrors ingresses/*-ingress-route.yaml.
        data-cache:
          entryPoints: ["{{ $ep }}"]
          rule: "PathPrefix(`/{{ $svcPath }}/studioapi/data-cache`)"
          priority: 11
          middlewares: ["strip-studioapi", "auth-data-cache"]
          service: be-data-cache
        data-rest:
          entryPoints: ["{{ $ep }}"]
          rule: "PathPrefix(`/{{ $svcPath }}/studioapi/data`)"
          priority: 10
          middlewares: ["strip-studioapi", "auth-data-rest"]
          service: be-data-rest
        dispatcher:
          entryPoints: ["{{ $ep }}"]
          rule: "PathPrefix(`/{{ $svcPath }}/dispatcher`)"
          priority: 10
          middlewares: ["strip-dispatcher"]
          service: be-dispatcher
        release-state:
          entryPoints: ["{{ $ep }}"]
          rule: "PathPrefix(`/{{ $svcPath }}/studioapi/api/release/status`)"
          priority: 11
          middlewares: ["strip-studioapi"]
          service: be-release-state
        runtime-api:
          entryPoints: ["{{ $ep }}"]
          rule: "PathPrefix(`/{{ $svcPath }}/runtimeapi`)"
          priority: 10
          middlewares: ["strip-runtimeapi"]
          service: be-runtime-api
        search:
          entryPoints: ["{{ $ep }}"]
          rule: "PathPrefix(`/{{ $svcPath }}/studioapi/search`)"
          priority: 99
          middlewares: ["strip-studioapi", "auth-search"]
          service: be-search-service
        search-metadata:
          entryPoints: ["{{ $ep }}"]
          rule: "PathPrefix(`/{{ $svcPath }}/studioapi/metadata`)"
          priority: 99
          middlewares: ["strip-studioapi", "auth-search-metadata"]
          service: be-search-service
        ai-agent:
          entryPoints: ["{{ $ep }}"]
          rule: "PathPrefix(`/{{ $svcPath }}/studioapi/ai-agent`)"
          priority: 99
          middlewares: ["strip-studioapi", "auth-ai-agent"]
          service: be-search-service
        {{- if .Values.searchService.bullDashboardEnabled }}
        bull-dashboard:
          entryPoints: ["{{ $ep }}"]
          rule: "PathPrefix(`/admin/queues`)"
          priority: 100
          service: be-search-service
        {{- end }}
        studio-api:
          entryPoints: ["{{ $ep }}"]
          rule: "PathPrefix(`/{{ $svcPath }}/studioapi/api`)"
          priority: 10
          middlewares: ["drop-internal-headers", "strip-studioapi"]
          service: be-studio-api
        oauth-callback:
          entryPoints: ["{{ $ep }}"]
          rule: "PathPrefix(`/oauth2/callback`)"
          priority: 101
          middlewares: ["oauth-replace-path"]
          service: be-studio-api
        # OAuth2 discovery/registration/protocol endpoints -> authorization
        # server. Mirrors ingresses/mcp-server-ingress-route.yaml for the file
        # provider. /oauth2/callback keeps priority 101 above and still wins.
        oauth2-endpoints:
          entryPoints: ["{{ $ep }}"]
          rule: "PathPrefix(`/.well-known/oauth-protected-resource`) || PathPrefix(`/.well-known/oauth-authorization-server`) || PathPrefix(`/.well-known/openai-apps-challenge`) || PathPrefix(`/.well-known/openid-configuration`) || PathPrefix(`/connect/register`) || Path(`/register`) || PathPrefix(`/oauth2/`)"
          priority: 100
          service: be-oauth2-authorization-server
        # MCP server handles the MCP endpoint itself. A project-preselected connection URL carries the project in
        # the path (/p/{projectId}/mcp, DEV-4244); the studio router claims no /p/ route, so the whole /p/ prefix is
        # the MCP server's.
        mcp-server:
          entryPoints: ["{{ $ep }}"]
          rule: "PathPrefix(`/mcp`) || PathPrefix(`/p/`)"
          priority: 10
          service: peaka-mcp-server
        workflow-history:
          entryPoints: ["{{ $ep }}"]
          rule: "PathPrefix(`/{{ $svcPath }}/studioapi/history`)"
          priority: 10
          middlewares: ["strip-studioapi", "auth-workflow-history"]
          service: be-workflow-history
        fe-studio-app:
          entryPoints: ["{{ $ep }}"]
          rule: "PathPrefix(`/`)"
          priority: 1
          service: fe-studio-app
        dbc:
          entryPoints: ["dbc"]
          rule: "PathPrefix(`/`)"
          priority: 1000
          middlewares: ["trino-extra-credential"]
          service: be-data-rest
        {{- if and .Values.minio.enabled (not .Values.externalObjectStore.enabled) (not .Values.exportDownloadProxy.enabled) }}
        # Query export artifacts served from MinIO (bucket "export") via
        # presigned URLs under a sub-path; the strip middleware removes the
        # public prefix so the S3 signature stays valid.
        minio-export:
          entryPoints: ["{{ $ep }}"]
          rule: "PathPrefix(`{{ include "peaka.routes.exportPublicPath" . }}/`)"
          priority: 12
          middlewares: ["minio-export-strip"]
          service: minio
        {{- end }}

      middlewares:
        # Shared path-strip middlewares (identical regexes were deduplicated
        # from the former per-route Middleware objects).
        strip-studioapi:
          replacePathRegex:
            regex: "^/{{ $svcPath }}/studioapi/(.*)"
            replacement: "/${1}"
        strip-dispatcher:
          replacePathRegex:
            regex: "^/{{ $svcPath }}/dispatcher/(.*)"
            replacement: "/${1}"
        strip-runtimeapi:
          replacePathRegex:
            regex: "^/{{ $svcPath }}/runtimeapi/(.*)"
            replacement: "/${1}"
        strip-sharedb:
          replacePathRegex:
            regex: "^/{{ $svcPath }}/sharedb/(.*)"
            replacement: "/${1}"
        strip-partner:
          replacePathRegex:
            regex: "^/{{ include "peaka.routes.partnerPath" . }}/(.*)"
            replacement: "/${1}"
        {{- if and .Values.minio.enabled (not .Values.externalObjectStore.enabled) (not .Values.exportDownloadProxy.enabled) }}
        minio-export-strip:
          replacePathRegex:
            regex: "^{{ include "peaka.routes.exportPublicPath" . }}/(.*)"
            replacement: "/${1}"
        {{- end }}
        # ipAllowList with a documentation-only range (RFC 5737 TEST-NET-1) is how Traefik says "no one": the range
        # matches no real client, so every request to the route is refused with 403.
        deny-internal-path:
          ipAllowList:
            sourceRange:
              - 192.0.2.1/32
        oauth-replace-path:
          replacePath:
            path: /api/connections/oauth2/callback
        forwarded-proto:
          headers:
            customRequestHeaders:
              {{- if (include "peaka.traefikTls.enabled" .) }}
              X-Forwarded-Proto: https
              {{- else }}
              X-Forwarded-Proto: http
              {{- end }}
        drop-internal-headers:
          headers:
            customRequestHeaders:
              X-Peaka-User-Id: ""
              X-Peaka-Scope: ""
        auth-data-cache:
          forwardAuth:
            address: http://{{ $fullname }}-be-permission-service.{{ $ns }}.svc.cluster.local:80/auth/data-cache-auth-check
            authResponseHeadersRegex: ^X-Internal-Authorization-
        auth-data-rest:
          forwardAuth:
            address: http://{{ $fullname }}-be-permission-service.{{ $ns }}.svc.cluster.local:80/auth/data-rest-auth-check
            authResponseHeadersRegex: ^X-Internal-Authorization-
            authResponseHeaders:
              - "X-Peaka-User-Id"
              - "X-Peaka-Api-Key"
              - "X-Peaka-Username"
        auth-search:
          forwardAuth:
            address: http://{{ $fullname }}-be-permission-service.{{ $ns }}.svc.cluster.local:80/auth/search-auth-check
            authResponseHeadersRegex: ^X-Internal-Authorization-
            authResponseHeaders:
              - "X-Peaka-User-Id"
              - "X-Peaka-Api-Key"
        auth-search-metadata:
          forwardAuth:
            address: http://{{ $fullname }}-be-permission-service.{{ $ns }}.svc.cluster.local:80/auth/search-metadata-auth-check
            authResponseHeadersRegex: ^X-Internal-Authorization-
            authResponseHeaders:
              - "X-Peaka-User-Id"
              - "X-Peaka-Api-Key"
        auth-ai-agent:
          forwardAuth:
            address: http://{{ $fullname }}-be-permission-service.{{ $ns }}.svc.cluster.local:80/auth/ai-agent-auth-check
            authResponseHeadersRegex: ^X-Internal-Authorization-
            authResponseHeaders:
              - "X-Peaka-User-Id"
              - "X-Peaka-Api-Key"
        auth-workflow-history:
          forwardAuth:
            address: http://{{ $fullname }}-be-permission-service.{{ $ns }}.svc.cluster.local:80/auth/workflow-history-auth-check
            authResponseHeadersRegex: ^X-Internal-Authorization-
        trino-extra-credential:
          forwardAuth:
            address: http://{{ $fullname }}-be-permission-service.{{ $ns }}.svc.cluster.local:80/auth/dbc-custom-header-handling
            # Every header listed here is removed from the driver's request and set only from the auth answer. data-rest
            # reads the project from X-Peaka-Project-Id before the key, treats a request with no user and no key as
            # internal, and takes the Trino user from X-Internal-Authorization-Username: none of them may come from a
            # driver (DEV-4136). The auth answer never sets the last two, so they are always dropped here.
            authResponseHeadersRegex: ^X-Internal-Authorization-
            authResponseHeaders:
              - "X-Trino-Extra-Credential"
              - "X-Peaka-User-Id"
              - "X-Peaka-Api-Key"
              - "X-Peaka-Username"
              - "X-Peaka-Project-Id"

      services:
        be-oauth2-authorization-server:
          loadBalancer:
            passHostHeader: true
            servers:
              - url: http://{{ $fullname }}-be-oauth2-authorization-server:80
        peaka-mcp-server:
          loadBalancer:
            passHostHeader: true
            servers:
              - url: http://{{ $fullname }}-peaka-mcp-server:80
        be-dispatcher:
          loadBalancer:
            passHostHeader: true
            servers:
              - url: http://{{ $fullname }}-be-dispatcher:80
        be-cloud-gateway:
          loadBalancer:
            passHostHeader: true
            servers:
              - url: http://{{ $fullname }}-be-cloud-gateway:80
        be-collab-sharedb-websocket:
          loadBalancer:
            passHostHeader: true
            servers:
              - url: http://{{ $fullname }}-be-collab-sharedb-websocket:443
        be-data-cache:
          loadBalancer:
            passHostHeader: true
            servers:
              - url: http://{{ $fullname }}-be-data-cache:80
        be-data-rest:
          loadBalancer:
            passHostHeader: true
            servers:
              - url: http://{{ $fullname }}-be-data-rest:80
        be-release-state:
          loadBalancer:
            passHostHeader: true
            servers:
              - url: http://{{ $fullname }}-be-release-state:80
        be-runtime-api:
          loadBalancer:
            passHostHeader: true
            servers:
              - url: http://{{ $fullname }}-be-runtime-api:80
        be-search-service:
          loadBalancer:
            passHostHeader: true
            sticky:
              cookie:
                name: {{ $fullname }}
                httpOnly: true
                secure: true
            servers:
              - url: http://{{ $fullname }}-be-search-service:80
        be-studio-api:
          loadBalancer:
            passHostHeader: true
            servers:
              - url: http://{{ $fullname }}-be-studio-api:80
        be-workflow-history:
          loadBalancer:
            passHostHeader: true
            servers:
              - url: http://{{ $fullname }}-be-workflow-history:80
        fe-studio-app:
          loadBalancer:
            passHostHeader: true
            servers:
              - url: http://{{ $fullname }}-fe-studio-app:80
        {{- if and .Values.minio.enabled (not .Values.externalObjectStore.enabled) (not .Values.exportDownloadProxy.enabled) }}
        minio:
          loadBalancer:
            passHostHeader: true
            servers:
              - url: http://{{ include "peaka.minio.fullname" . }}:{{ include "peaka.minio.port" . | int }}
        {{- end }}

    {{- if (include "peaka.traefikTls.enabled" .) }}
    tls:
      certificates:
        - certFile: /certs/tls.crt
          keyFile: /certs/tls.key
      stores:
        default:
          defaultCertificate:
            certFile: /certs/tls.crt
            keyFile: /certs/tls.key
    {{- end }}
{{- end }}
{{- end }}
