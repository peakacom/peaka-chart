{{/*
Middlewares referenced by more than one IngressRoute.

strip-studioapi-prefix rewrites /<servicePath>/studioapi/<rest> to /<rest>.

Six IngressRoutes across eight route rules need exactly this:
  studio-api, data-rest, data-cache, workflow-history, release-state
    - one rule each; each used to ship its own byte-identical copy of this
      Middleware under a per-service name
  search-service
    - three rules; it never defined its own, it referenced studio-api's.
      That is why deleting the per-service copies without repointing
      search-service would leave dangling middlewareRefs.
*/}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "peaka.fullname" . }}-strip-studioapi-prefix
  labels:
    app.kubernetes.io/name: {{ include "peaka.fullname" . }}
    {{- include "peaka.labels" . | nindent 4 }}
spec:
  replacePathRegex:
    regex: "^/{{ include "peaka.routes.servicePath" . }}/studioapi/(.*)"
    replacement: "/${1}"
