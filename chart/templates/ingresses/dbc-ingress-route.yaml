apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "peaka.fullname" . }}-dbc-routes
  labels:
    app.kubernetes.io/name: {{ include "peaka.fullname" . }}-dbc
    {{- include "peaka.labels" . | nindent 4 }}
  {{- if and .Values.ingressRoute .Values.ingressRoute.annotations }}
  annotations:
    {{- toYaml .Values.ingressRoute.annotations | nindent 4}}
  {{- end }}
spec:
  entryPoints:
    - dbc
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      priority: 1000
      middlewares:
        - name: {{ include "peaka.fullname" . }}-append-trino-extra-credential-header
      services:
        - name: {{ include "peaka.fullname" . }}-be-data-rest
          port: http
          passHostHeader: true
  {{- if .Values.tls.enabled }}
  tls:
    secretName: {{ .Values.tls.secretName | default (printf "%s-tls-secret" (include "peaka.fullname" .)) }}
  {{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "peaka.fullname" . }}-append-trino-extra-credential-header
  labels:
    app.kubernetes.io/name: {{ include "peaka.fullname" . }}-dbc
    {{- include "peaka.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: http://{{ include "peaka.fullname" . }}-be-permission-service.{{ .Release.Namespace }}.svc.cluster.local:80/auth/dbc-custom-header-handling
    # Every header listed here is removed from the driver's request and set only from the auth answer. data-rest
    # reads the project from X-Peaka-Project-Id before the key, treats a request with no user and no key as internal,
    # and takes the Trino user from X-Internal-Authorization-Username: none of them may come from a driver (DEV-4136).
    # The auth answer never sets the last two, so they are always dropped here.
    authResponseHeadersRegex: ^X-Internal-Authorization-
    authResponseHeaders: ["X-Trino-Extra-Credential", "X-Peaka-User-Id", "X-Peaka-Api-Key", "X-Peaka-Username", "X-Peaka-Project-Id"]