{{- if not .Values.secretStoreService.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "peaka.secretStore.keySecretName" . }}
  labels:
    app.kubernetes.io/name: {{ include "peaka.secretStore.keySecretName" . }}
    {{- include "peaka.labels" . | nindent 4 }}
  annotations:
    # secret-store encrypts every stored value with this key. A different key makes all of them
    # unreadable, so it must survive helm uninstall and a reinstall.
    helm.sh/resource-policy: keep
type: Opaque
data:
  SECRET_STORE_SECRET_KEY: {{ include "peaka.secretStore.key" . | b64enc | quote }}
{{- end }}
