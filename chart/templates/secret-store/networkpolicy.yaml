{{- if .Values.secretStoreService.networkPolicy.enabled }}
{{- $fullname := include "peaka.fullname" . }}
# Only the services that call secret-store reach it. Ingress only: egress is not restricted.
# Needs a CNI that enforces NetworkPolicy; otherwise this object has no effect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-be-secret-store-service
  labels:
    app.kubernetes.io/name: {{ $fullname }}-be-secret-store-service
    {{- include "peaka.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $fullname }}-be-secret-store-service
      {{- include "peaka.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Callers: pods of this release, in this namespace.
    - from:
        - podSelector:
            matchLabels:
              {{- include "peaka.selectorLabels" . | nindent 14 }}
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - {{ $fullname }}-be-auth-service
                  - {{ $fullname }}-be-email-service
                  - {{ $fullname }}-be-search-service
                  - {{ $fullname }}-be-token-service
                  - {{ $fullname }}-be-studio-api
      ports:
        - port: 8080
          protocol: TCP
    {{- with .Values.secretStoreService.networkPolicy.metricsNamespace }}
    # Monitoring (actuator, Prometheus metrics).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
      ports:
        - port: 9090
          protocol: TCP
    {{- end }}
{{- end }}
