# Run from the repo root: helm unittest chart
suite: secret-store encryption key
templates:
  - templates/secret-store/key-secret.yaml
release:
  name: peaka
  namespace: peaka
tests:
  # Key source order: existingSecret, the Secret the chart made earlier, the env ConfigMap of an install from
  # before the key moved, secretStoreService.secretEncryptionKey, a random key (fresh install), the old default.
  - it: generates a random 32-character key on a fresh install on a real cluster, kept on uninstall
    kubernetesProvider:
      scheme:
        "v1/ServiceAccount":
          gvr:
            version: v1
            resource: serviceaccounts
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: default
            namespace: peaka
    asserts:
      - equal:
          path: metadata.name
          value: peaka-secret-store-key
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - matchRegex:
          path: data.SECRET_STORE_SECRET_KEY
          pattern: ^[A-Za-z0-9]{32}$
          decodeBase64: true

  - it: uses the key from values on a fresh install
    set:
      secretStoreService.secretEncryptionKey: "0123456789abcdef"
    asserts:
      - equal:
          path: data.SECRET_STORE_SECRET_KEY
          value: "0123456789abcdef"
          decodeBase64: true

  - it: creates no Secret when existingSecret is set
    set:
      secretStoreService.existingSecret: my-key
    asserts:
      - hasDocuments:
          count: 0

  - it: reuses the Secret the chart made earlier, whatever values say
    release:
      upgrade: true
    set:
      secretStoreService.secretEncryptionKey: "0123456789abcdef"
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: peaka-secret-store-key
            namespace: peaka
          data:
            SECRET_STORE_SECRET_KEY: a2VwdC1rZXktMDEyMzQ1Ng==  # kept-key-0123456
    asserts:
      - equal:
          path: data.SECRET_STORE_SECRET_KEY
          value: kept-key-0123456
          decodeBase64: true

  - it: reuses the Secret on a reinstall (kept after uninstall)
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: peaka-secret-store-key
            namespace: peaka
          data:
            SECRET_STORE_SECRET_KEY: a2VwdC1rZXktMDEyMzQ1Ng==  # kept-key-0123456
    asserts:
      - equal:
          path: data.SECRET_STORE_SECRET_KEY
          value: kept-key-0123456
          decodeBase64: true

  # An install from before the key moved: the env ConfigMap is what the running pods use.
  - it: carries over the key of the old env ConfigMap on upgrade, ignoring the new empty default
    release:
      upgrade: true
    kubernetesProvider:
      scheme:
        "v1/ConfigMap":
          gvr:
            version: v1
            resource: configmaps
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: peaka-env-config
            namespace: peaka
          data:
            SECRET_STORE_SECRET_KEY: XXjAe6xLfVWTG5Rf
    asserts:
      - equal:
          path: data.SECRET_STORE_SECRET_KEY
          value: XXjAe6xLfVWTG5Rf
          decodeBase64: true

  - it: carries over a custom key of the old env ConfigMap even when values no longer repeat it
    release:
      upgrade: true
    kubernetesProvider:
      scheme:
        "v1/ConfigMap":
          gvr:
            version: v1
            resource: configmaps
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: peaka-env-config
            namespace: peaka
          data:
            SECRET_STORE_SECRET_KEY: custom-key-123456
    asserts:
      - equal:
          path: data.SECRET_STORE_SECRET_KEY
          value: custom-key-123456
          decodeBase64: true

  - it: writes the old default on upgrade on a real cluster when nothing else is known
    release:
      upgrade: true
    kubernetesProvider:
      scheme:
        "v1/ServiceAccount":
          gvr:
            version: v1
            resource: serviceaccounts
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: default
            namespace: peaka
    asserts:
      - equal:
          path: data.SECRET_STORE_SECRET_KEY
          value: XXjAe6xLfVWTG5Rf
          decodeBase64: true

  - it: writes the explicit key on upgrade when nothing else is known
    release:
      upgrade: true
    set:
      secretStoreService.secretEncryptionKey: "0123456789abcdef"
    asserts:
      - equal:
          path: data.SECRET_STORE_SECRET_KEY
          value: "0123456789abcdef"
          decodeBase64: true

  - it: does not use the old env ConfigMap once the chart's Secret exists
    release:
      upgrade: true
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: v1
            resource: secrets
          namespaced: true
        "v1/ConfigMap":
          gvr:
            version: v1
            resource: configmaps
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: peaka-secret-store-key
            namespace: peaka
          data:
            SECRET_STORE_SECRET_KEY: a2VwdC1rZXktMDEyMzQ1Ng==  # kept-key-0123456
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: peaka-env-config
            namespace: peaka
          data:
            SECRET_STORE_SECRET_KEY: XXjAe6xLfVWTG5Rf
    asserts:
      - equal:
          path: data.SECRET_STORE_SECRET_KEY
          value: kept-key-0123456
          decodeBase64: true

  - it: names the Secret from fullnameOverride
    set:
      fullnameOverride: acme
      secretStoreService.secretEncryptionKey: "0123456789abcdef"
    asserts:
      - equal:
          path: metadata.name
          value: acme-secret-store-key

  # No cluster access (helm template, helm upgrade --dry-run, Argo CD): lookup finds nothing, so a generated key
  # would change on every render. The render must refuse instead.
  - it: fails without cluster access (helm template) unless the key is given
    asserts:
      - failedTemplate:
          errorPattern: cannot be generated

  - it: fails without cluster access on an upgrade too (helm upgrade --dry-run)
    release:
      upgrade: true
    asserts:
      - failedTemplate:
          errorPattern: cannot be generated

  - it: renders without cluster access when existingSecret is set, and creates no Secret
    set:
      secretStoreService.existingSecret: my-key
    asserts:
      - hasDocuments:
          count: 0

  - it: renders without cluster access when the key is set in values
    set:
      secretStoreService.secretEncryptionKey: "0123456789abcdef"
    asserts:
      - equal:
          path: data.SECRET_STORE_SECRET_KEY
          value: "0123456789abcdef"
          decodeBase64: true
