# Run from the repo root: helm unittest chart
suite: secret-store network policy
templates:
  - templates/secret-store/networkpolicy.yaml
release:
  name: peaka
  namespace: peaka
tests:
  - it: is on by default and selects the secret-store pods
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: peaka-be-secret-store-service
            app.kubernetes.io/instance: peaka
      - equal:
          path: spec.policyTypes
          value: [Ingress]

  - it: admits only the callers, by the chart's own pod labels, on the service port
    asserts:
      - equal:
          path: spec.ingress[0].from
          value:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/instance: peaka
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - peaka-be-auth-service
                      - peaka-be-email-service
                      - peaka-be-search-service
                      - peaka-be-token-service
                      - peaka-be-studio-api
      - equal:
          path: spec.ingress[0].ports
          value:
            - port: 8080
              protocol: TCP

  - it: admits the monitoring namespace on the metrics port only
    asserts:
      - equal:
          path: spec.ingress[1].from
          value:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: monitoring
      - equal:
          path: spec.ingress[1].ports
          value:
            - port: 9090
              protocol: TCP

  - it: takes the monitoring namespace from values
    set:
      secretStoreService.networkPolicy.metricsNamespace: observability
    asserts:
      - equal:
          path: spec.ingress[1].from[0].namespaceSelector
          value:
            matchLabels:
              kubernetes.io/metadata.name: observability

  - it: opens no metrics port when the monitoring namespace is empty
    set:
      secretStoreService.networkPolicy.metricsNamespace: ""
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 1

  - it: follows fullnameOverride in the caller names
    set:
      fullnameOverride: acme
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/name"]
          value: acme-be-secret-store-service
      - contains:
          path: spec.ingress[0].from[0].podSelector.matchExpressions[0].values
          content: acme-be-studio-api

  - it: renders nothing when disabled
    set:
      secretStoreService.networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
