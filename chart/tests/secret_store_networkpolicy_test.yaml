# Run from the repo root: helm unittest chart
suite: secret-store network policy
templates:
  - templates/secret-store/networkpolicy.yaml
release:
  name: peaka
  namespace: peaka
tests:
  - it: is on by default and selects the secret-store pods
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: peaka-be-secret-store-service
            app.kubernetes.io/instance: peaka
      - equal:
          path: spec.policyTypes
          value: [Ingress]

  - it: admits only the callers, by the chart's own pod labels, on the service port
    asserts:
      - equal:
          path: spec.ingress[0].from
          value:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/instance: peaka
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - peaka-be-auth-service
                      - peaka-be-email-service
                      - peaka-be-search-service
                      - peaka-be-token-service
                      - peaka-be-studio-api
      - equal:
          path: spec.ingress[0].ports
          value:
            - port: 8080
              protocol: TCP

  - it: admits the monitoring namespace on the metrics port only
    asserts:
      - equal:
          path: spec.ingress[1].from
          value:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: monitoring
      - equal:
          path: spec.ingress[1].ports
          value:
            - port: 9090
              protocol: TCP

  - it: takes the monitoring namespace from values
    set:
      secretStoreService.networkPolicy.metricsNamespace: observability
    asserts:
      - equal:
          path: spec.ingress[1].from[0].namespaceSelector
          value:
            matchLabels:
              kubernetes.io/metadata.name: observability

  - it: opens no metrics port when the monitoring namespace is empty
    set:
      secretStoreService.networkPolicy.metricsNamespace: ""
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 1

  - it: follows fullnameOverride in the caller names
    set:
      fullnameOverride: acme
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/name"]
          value: acme-be-secret-store-service
      - contains:
          path: spec.ingress[0].from[0].podSelector.matchExpressions[0].values
          content: acme-be-studio-api

  - it: renders nothing when disabled
    set:
      secretStoreService.networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # Unset flag: on for new installs, off for an upgrade of an install that never had the policy.
  - it: is on for a fresh install on a real cluster
    kubernetesProvider:
      scheme:
        "v1/ServiceAccount":
          gvr:
            version: v1
            resource: serviceaccounts
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: default
            namespace: peaka
    asserts:
      - isKind:
          of: NetworkPolicy

  - it: is off on an upgrade of an install that never had it
    release:
      upgrade: true
    kubernetesProvider:
      scheme:
        "v1/ServiceAccount":
          gvr:
            version: v1
            resource: serviceaccounts
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: default
            namespace: peaka
    asserts:
      - hasDocuments:
          count: 0

  - it: stays on on an upgrade of an install that has it (lookup)
    release:
      upgrade: true
    kubernetesProvider:
      scheme:
        "v1/ServiceAccount":
          gvr:
            version: v1
            resource: serviceaccounts
          namespaced: true
        "networking.k8s.io/v1/NetworkPolicy":
          gvr:
            group: networking.k8s.io
            version: v1
            resource: networkpolicies
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: default
            namespace: peaka
        - apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: peaka-be-secret-store-service
            namespace: peaka
    asserts:
      - isKind:
          of: NetworkPolicy

  - it: is on on an upgrade of an install that never had it when set to true
    release:
      upgrade: true
    set:
      secretStoreService.networkPolicy.enabled: true
    kubernetesProvider:
      scheme:
        "v1/ServiceAccount":
          gvr:
            version: v1
            resource: serviceaccounts
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: default
            namespace: peaka
    asserts:
      - isKind:
          of: NetworkPolicy

  - it: is off on a fresh install on a real cluster when set to false
    set:
      secretStoreService.networkPolicy.enabled: false
    kubernetesProvider:
      scheme:
        "v1/ServiceAccount":
          gvr:
            version: v1
            resource: serviceaccounts
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: default
            namespace: peaka
    asserts:
      - hasDocuments:
          count: 0

  # helm template, helm upgrade --dry-run, Argo CD: no cluster access, every render counts as a fresh install.
  - it: is on without cluster access (helm template)
    asserts:
      - isKind:
          of: NetworkPolicy

  - it: is on without cluster access on an upgrade too (helm upgrade --dry-run)
    release:
      upgrade: true
    asserts:
      - isKind:
          of: NetworkPolicy

---
suite: secret-store network policy notes
templates:
  - templates/NOTES.txt
release:
  name: peaka
  namespace: peaka
set:
  secretStoreService.existingSecret: my-key
tests:
  - it: NOTES says the policy is on and how to turn it off
    asserts:
      - matchRegex:
          path: raw
          pattern: networkPolicy.enabled=false
  - it: NOTES says how to opt in on an upgrade of an install that never had it
    release:
      upgrade: true
    kubernetesProvider:
      scheme:
        "v1/ServiceAccount":
          gvr:
            version: v1
            resource: serviceaccounts
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: default
            namespace: peaka
    asserts:
      - matchRegex:
          path: raw
          pattern: NetworkPolicy is off because this install did not have it before
