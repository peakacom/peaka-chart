# Run from the repo root: helm unittest chart
suite: secret-store encryption key validation and notes
templates:
  - templates/validate.yaml
  - templates/NOTES.txt
release:
  name: peaka
  namespace: peaka
tests:
  - it: refuses the former public default on a fresh install
    template: templates/validate.yaml
    set:
      secretStoreService.secretEncryptionKey: XXjAe6xLfVWTG5Rf
    asserts:
      - failedTemplate:
          errorPattern: former default, which is public

  - it: accepts the former public default on an upgrade (it is carried over, with a warning)
    template: templates/validate.yaml
    release:
      upgrade: true
    set:
      secretStoreService.secretEncryptionKey: XXjAe6xLfVWTG5Rf
    asserts:
      - notFailedTemplate: {}

  - it: accepts the former public default on a fresh install when existingSecret is set
    template: templates/validate.yaml
    set:
      secretStoreService.secretEncryptionKey: XXjAe6xLfVWTG5Rf
      secretStoreService.existingSecret: my-key
    asserts:
      - notFailedTemplate: {}

  - it: NOTES tells a fresh install to back up the generated key
    template: templates/NOTES.txt
    kubernetesProvider:
      scheme:
        "v1/ServiceAccount":
          gvr:
            version: v1
            resource: serviceaccounts
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: default
            namespace: peaka
    asserts:
      - matchRegex:
          path: raw
          pattern: was generated and stored in Secret peaka-secret-store-key

  - it: NOTES warns when an upgrade moves the public default into the Secret
    template: templates/NOTES.txt
    release:
      upgrade: true
    kubernetesProvider:
      scheme:
        "v1/ConfigMap":
          gvr:
            version: v1
            resource: configmaps
          namespaced: true
      objects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: peaka-env-config
            namespace: peaka
          data:
            SECRET_STORE_SECRET_KEY: XXjAe6xLfVWTG5Rf
    asserts:
      - matchRegex:
          path: raw
          pattern: moved from the env ConfigMap to Secret peaka-secret-store-key
      - matchRegex:
          path: raw
          pattern: "WARNING: that value is the chart's former default"

  - it: NOTES does not call a custom key public
    template: templates/NOTES.txt
    release:
      upgrade: true
    set:
      secretStoreService.secretEncryptionKey: "0123456789abcdef"
    asserts:
      - matchRegex:
          path: raw
          pattern: moved from the env ConfigMap
      - notMatchRegex:
          path: raw
          pattern: former default

  - it: NOTES says nothing about the key when existingSecret is used
    template: templates/NOTES.txt
    set:
      secretStoreService.existingSecret: my-key
    asserts:
      - notMatchRegex:
          path: raw
          pattern: secret-store encryption key

---
suite: secret-store key reaches only the secret-store pod
# The Deployment's checksum annotation includes env-configmap.yaml, which defines MONITORING_SERVICE_INTERNAL_URL
# twice (_helpers.tpl); helm-unittest's YAML parser rejects that, so the post-renderer drops the second (quoted) copy.
templates:
  - templates/secret-store/deployment.yaml
  - templates/env-configmap.yaml
postRenderer:
  cmd: sed
  args:
    - '/^  MONITORING_SERVICE_INTERNAL_URL: "/d'
release:
  name: peaka
  namespace: peaka
# CI runs `helm unittest` without the gitignored subchart archives (chart/charts); set the subchart defaults the
# env ConfigMap reads (values = the subcharts' own defaults).
set:
  minio.service.port: 9000
  kafka.service.ports.client: 9092
  mongodb.service.ports.mongodb: 27017
  mongodb.tls.enabled: false
  permify.app.server.http.port: 3476
tests:
  - it: gives secret-store the key from the chart's Secret, also without readinessHealthGroup
    template: templates/secret-store/deployment.yaml
    set:
      secretStoreService.readinessHealthGroup: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SECRET_STORE_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: peaka-secret-store-key
                key: SECRET_STORE_SECRET_KEY

  - it: gives secret-store the key from existingSecret
    template: templates/secret-store/deployment.yaml
    set:
      secretStoreService.existingSecret: my-key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SECRET_STORE_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: my-key
                key: SECRET_STORE_SECRET_KEY

  - it: keeps the key out of the env ConfigMap every workload reads
    template: templates/env-configmap.yaml
    set:
      secretStoreService.secretEncryptionKey: "0123456789abcdef"
    asserts:
      - notExists:
          path: data.SECRET_STORE_SECRET_KEY
